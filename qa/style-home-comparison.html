<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approved style vs implementation</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: #11130e;
        background: #efefe7;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main {
        width: 1920px;
        height: 1120px;
        padding: 42px 72px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 24px;
      }
      header { display: flex; align-items: flex-end; justify-content: space-between; }
      h1 { margin: 0; font-size: 36px; letter-spacing: -.04em; }
      p { margin: 7px 0 0; color: #6f7368; font-size: 17px; }
      .status {
        padding: 10px 16px;
        border-radius: 999px;
        color: #11130e;
        background: #e8ff32;
        font-size: 15px;
        font-weight: 750;
      }
      .comparison {
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 34px;
      }
      figure {
        min-height: 0;
        margin: 0;
        padding: 20px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 14px;
        border: 1px solid rgba(27, 31, 20, .1);
        border-radius: 30px;
        background: #fffef8;
        box-shadow: 0 18px 50px rgba(30, 33, 20, .08);
      }
      figcaption { display: flex; align-items: center; justify-content: space-between; }
      figcaption b { font-size: 19px; }
      figcaption span { color: #7b7f74; font-size: 13px; }
      .frame {
        position: relative;
        height: 850px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 23px;
        background: #f5f4ea;
      }
      img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        box-shadow: 0 12px 34px rgba(24, 27, 17, .12);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>首页风格对照</h1>
          <p>相同信息架构与交互布局，仅比较已确认视觉方向和代码实现。</p>
        </div>
        <div class="status">Design QA · Passed</div>
      </header>
      <section class="comparison">
        <figure>
          <figcaption><b>已确认效果图</b><span>暖白 · 荧光黄绿 · 影像主导</span></figcaption>
          <div class="frame"><img src="approved-style-preview.png" alt="已确认效果图" /></div>
        </figure>
        <figure>
          <figcaption><b>当前代码实现</b><span>390 × 844 · 真实交互页面</span></figcaption>
          <div class="frame"><img src="20-home-v2-mobile.png" alt="当前代码实现" /></div>
        </figure>
      </section>
    </main>
  </body>
</html>
