<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      body { width: 1920px; height: 1140px; margin: 0; overflow: hidden; color: #111827; background: #edf1f5; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { padding: 34px 40px; }
      header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
      h1 { margin: 0; font-size: 34px; letter-spacing: -1px; }
      header p { margin: 0; color: #64748b; font-size: 17px; }
      .grid { height: 965px; display: grid; grid-template-columns: 1.25fr .75fr; gap: 24px; }
      .panel { position: relative; overflow: hidden; border: 1px solid rgba(148,163,184,.25); border-radius: 28px; background: white; box-shadow: 0 20px 48px rgba(15,23,42,.08); }
      .label { position: absolute; z-index: 4; left: 18px; top: 18px; padding: 9px 14px; border-radius: 999px; color: white; background: rgba(15,23,42,.9); font-size: 15px; font-weight: 700; }
      .sources { padding: 64px 20px 20px; display: flex; justify-content: center; gap: 22px; }
      .sources figure, .result figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .sources img { width: 372px; height: 810px; object-fit: cover; object-position: top; border: 7px solid #dbe2ea; border-radius: 30px; }
      figcaption { color: #475569; font-size: 16px; font-weight: 650; }
      .result { padding: 64px 20px 20px; display: grid; place-items: center; }
      .result img { width: 390px; height: 844px; object-fit: cover; object-position: top; border: 8px solid #111827; border-radius: 38px; box-shadow: 0 18px 38px rgba(15,23,42,.2); }
      .result figcaption { color: #087cf5; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>“我的”与“旅迹”合并 · 参考页 → 实现</h1><p>个人身份、数据、管理工具与最近旅迹被收拢到同一条用户路径。</p></header>
      <section class="grid">
        <article class="panel sources"><span class="label">原有两个页面</span><figure><img src="file:///private/var/folders/r1/jwxx9y5d4fl_3zqd47m2gr8m0000gn/T/TemporaryItems/NSIRD_screencaptureui_TNw7Pu/截屏2026-09-16%2016.20.58.png" alt="我的页面" /><figcaption>我的：身份与管理工具</figcaption></figure><figure><img src="file:///private/var/folders/r1/jwxx9y5d4fl_3zqd47m2gr8m0000gn/T/TemporaryItems/NSIRD_screencaptureui_SRentS/截屏2026-09-16%2016.21.10.png" alt="旅迹页面" /><figcaption>旅迹：数据、记录与内容</figcaption></figure></article>
        <article class="panel result"><span class="label">合并结果 · 390 × 844</span><figure><img src="22-merged-journey-mobile.png" alt="我的旅迹合并页面" /><figcaption>头像入口与底栏“旅迹”进入同一页面</figcaption></figure></article>
      </section>
    </main>
  </body>
</html>
